name: VESCDashboard

options:
  bundleIdPrefix: com.vescdash
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_PREVIEWS: YES

targets:
  VESCDashboard:
    type: application
    platform: iOS
    sources:
      - path: VESCDashboard
        excludes:
          - "Info.plist"
    info:
      path: VESCDashboard/Info.plist
      properties:
        CFBundleDisplayName: "Dynetra"
        NSBluetoothAlwaysUsageDescription: "Dynetra uses Bluetooth to connect to your VESC motor controller and display real-time telemetry data."
        NSBluetoothPeripheralUsageDescription: "Dynetra uses Bluetooth to connect to your VESC motor controller."
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vescdash.VESCDashboard
        INFOPLIST_FILE: VESCDashboard/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies: []
    scheme:
      testTargets:
        - VESCDashboardTests
      gatherCoverageData: true

  VESCDashboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VESCDashboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vescdash.VESCDashboardTests
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VESCDashboard
