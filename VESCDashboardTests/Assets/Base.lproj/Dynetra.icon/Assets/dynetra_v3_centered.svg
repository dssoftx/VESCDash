  <!--
    Font-size 90px. In SVG, text baseline is roughly at y anchor.
    Cap height ≈ 65% of font-size = ~58.5px above baseline.
    Descenders ≈ 20% = ~18px below baseline.
    Visual center of capitals = baseline - capHeight/2 = baseline - 29px.
    D center = y=0. So baseline should be at y = 0 + 29 = 29.
    Using text-anchor and explicit y=29 with no dominant-baseline so every renderer agrees.
  -->
